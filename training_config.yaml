# ==============================================================================
# Inspectra AI — TensorFlow / Keras Pipeline Training & Hyperparameters Config
# ==============================================================================
# Centralized training configuration defining core hyperparameters, data splits,
# architecture options, and quality gate confidence thresholds.

# Core Hyperparameters (Required Specification)
image_size: 224
batch_size: 32
epochs: 50
learning_rate: 0.001
val_split: 0.15
test_split: 0.15
confidence_threshold: 0.60

# Model Architecture Configuration
model:
  name: "EfficientNetB0"          # Transfer Learning backbone ('EfficientNetB0' or 'MobileNetV3Small')
  weights: "imagenet"             # Pretrained ImageNet feature representations
  input_shape: [224, 224, 3]      # Height, Width, RGB Channels
  image_size: [224, 224]          # Resolution matching image_size: 224
  dropout_rate: 0.30              # Regularization dropout probability
  freeze_backbone_initially: true # Phase 1 frozen backbone feature extractor
  unfreeze_top_layers: 20         # Phase 2 unfreeze top layers for fine-tuning

# Training Hyperparameters Detail
training:
  batch_size: 32
  epochs: 50                      # Phase 1 head training epochs
  fine_tune_epochs: 20            # Phase 2 top-layer fine-tuning epochs
  initial_learning_rate: 0.001    # 1e-3 initial learning rate for classifier head
  fine_tune_learning_rate: 0.0001 # 1e-4 fine-tuning learning rate
  optimizer: "adam"
  loss_function: "sparse_categorical_crossentropy"
  metrics:
    - "accuracy"

# Dataset Configuration & Splits
dataset:
  path: "data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  test_samples_dir: "data/test_samples"
  train_split: 0.70               # 70% Training
  val_split: 0.15                 # 15% Validation percentage
  test_split: 0.15                # 15% Holdout Testing
  random_seed: 42
  num_classes: 7

# Industrial Data Augmentation (Manufacturing-Safe)
augmentation:
  enabled: true
  rotation_factor: 0.04           # Small rotation (+/- 14 degrees max)
  translation_factor: 0.04        # Small translation (+/- 4% shift)
  zoom_factor: 0.04               # Small zoom (+/- 4% scale)
  horizontal_flip: true           # Physically valid horizontal mirror
  vertical_flip: false            # Disabled to preserve vertical orientation

# Callbacks & Convergence Controls
callbacks:
  early_stopping:
    monitor: "val_loss"
    patience: 7
    restore_best_weights: true
    min_delta: 0.001
  reduce_lr:
    monitor: "val_loss"
    factor: 0.5
    patience: 3
    min_lr: 0.000001              # 1e-6 minimum learning rate
  model_checkpoint:
    monitor: "val_accuracy"
    save_best_only: true
    filepath: "models/keras/defect_classifier.keras"

# Inference & Quality Gate Thresholds
inference:
  confidence_threshold: 0.60      # 60% confidence gate
  uncertain_label: "Uncertain prediction"
  severity_rules:
    crack: "CRITICAL"
    dimensional_irregularity: "CRITICAL"
    dent: "MAJOR"
    scratch: "MAJOR"
    stain: "MODERATE"
    discoloration: "MODERATE"
    normal: "NONE"

# Defect Taxonomy (7 Canonical Industrial Classes)
classes:
  - "Normal"
  - "Crack"
  - "Scratch"
  - "Dent"
  - "Stain"
  - "Discoloration"
  - "Dimensional Irregularity"

# Artifact & Export File Paths
paths:
  models_dir: "models/keras"
  outputs_dir: "outputs/keras"
  saved_model: "models/keras/defect_classifier.keras"
  class_names_json: "models/keras/class_names.json"
  model_config_json: "models/keras/model_config.json"
  training_history_json: "models/keras/training_history.json"
  classification_report_json: "outputs/keras/classification_report.json"
  confusion_matrix_png: "outputs/keras/confusion_matrix.png"
  training_history_png: "outputs/keras/training_history.png"
  evaluation_json: "outputs/keras/evaluation.json"
